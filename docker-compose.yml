services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: asauto
      POSTGRES_PASSWORD: asauto_dev_password
      POSTGRES_DB: asauto_dev
    ports:
      - "5432:5432"
    volumes:
      - asauto_pg_data:/var/lib/postgresql/data

volumes:
  asauto_pg_data:
